# Japanese translation of path.ko.yaml (2026-10-10), unified to です・ます (owner decision).
# Choices: docs/phase3-translation-notes.md
heading: "いまの考えは、どこから来たのか。"
closing: "そして、いま。自分が楽しく生きている姿を見せることから、始めています。"
nodes:
  "2023":
    label: "2023"
    doing: "個人プロジェクト、そしてバックエンドのインターン"
    thought: "AIが『どうやって』は、全部やってくれそうだと思いました。"
    thoughtNote: "それなら大事なのは、自分が『何を』うまくなりたいかです。"
    next: "その『何か』を探しに、いろいろやってみることにしました。"
  "2023-a":
    label: "2023-a"
    doing: "My Asset Manager（個人プロジェクト）"
    thought: "大学の教授の特別講義でつくった個人プロジェクトです。ChatGPTを使えば、知らない技術にどこまで慣れられるのか試したくて。"
    next: "その教授が、インターンを勧めてくださいました。"
  "2023-b":
    label: "2023-b"
    doing: "EveryAI — 教授に勧められたバックエンドのインターン"
    thought: "初めてAIをちゃんと使いました。AIで何でもできるようになる、と思いました。"
    next: "成果がすぐに見えないのが不安で、辞めました。振り返ると、焦りすぎていました。"
  "2024":
    label: "2024"
    doing: "パブ・工場・洋服のネットショップ"
    thought: "面白そうだから。あるいは、いっしょに働きたい人がいたから。"
    thoughtNote: "選ぶ基準は、いつも『自分が楽しめるか』でした。"
    photoAlts: ["工場で、出荷する荷物をトラックに積んだ日", "ネットショップの仕事で、床に積んだ袋詰めの服"]
    next: "いろいろな場所で働いてみて、仕事の中身より、どんな気持ちでやるかが大事だと分かりました。好きなものをたどって、次は美容の仕事でした。"
  "2025":
    label: "2025"
    doing: "コスメの店（オリーブヤング）→ 日本でワーキングホリデー"
    thought: "ほとんどの仕事の流れは、AIに任せられそうだと思いました。それなら自分は、人と向き合う仕事がしたい。"
    thoughtNote: "だからワーキングホリデーでも、接客の仕事を選びました。日本で暮らすうちに、ここでもっと深く暮らして、人の役に立つことがしたくなりました。"
    photoAlts: ["オリーブヤングで働いていたころ、制服姿で撮った鏡の自撮り", "ワーキングホリデー中、働いていたレストランで料理を運んでいるところ"]
    next: "役に立つために、何ができるだろう。仕事の流れを正確につかんで、AIで軽くすることに惹かれました。自分でつくり始めました。"
  "2026-h1":
    label: "2026 前半"
    doing: "ワーキングホリデー中、3月にはじめたバイブコーディング（AIに話しかけながらコードを書いてもらう開発）"
    thought: "人が自分の望む価値を見つけられるように、AIで手伝いたいと思いました。"
    thoughtNote: "つくるほど、問いが変わっていきました。その価値は、どうやって見つけるのか。自分の価値さえ分からないのに。"
  "2026-a":
    label: "2026-a"
    doing: "韓国式AI顔占い"
    thought: "はじめての一作です。完成して浮かんだのは「これ、なんでつくったんだろう」。答えは「はじめてだから、体験とテストを兼ねて」でした。"
    next: "次は、実際に使われるものをつくろうと決めました。"
  "2026-b":
    label: "2026-b"
    doing: "AI自販機"
    thought: "実際に使われるものを目指しました。でも、肝心の流れが思うように回りませんでした。"
    next: "AIの性能も自分の設計も足りず、だんだん離れていきました。"
  "2026-c":
    label: "2026-c"
    doing: "imysh"
    thought: "これまでやってきたことを、せめてきちんと整理しておこうと思いました。"
    next: "kigaru（気軽に遊べるAIコンテンツを集めた小さなギャラリー）と同じころ、人に会いに出かけるようになって、このサイトづくりも止まりました。いま読んでいるのが、その続きです。"
  "2026-d":
    label: "2026-d"
    doing: "Second Brain（記録をためて、AIといっしょに引き出す仕組み）の設計"
    thought: "設計まではしました。でも、記録を入れて取り出す手間が大きく見えて、そのままにしました。"
    next: "そのとき選んだ答えは、コードではなく人でした。たくさんの人に会って、たくさん話しに出かけました。"
  "2026-h2":
    label: "2026 後半"
    doing: "お客さんと話す営業の仕事 → 工事現場"
    thought: "人と向き合う仕事。そして、業種に関係なくAIを使ってみること。"
    thoughtNote: "お客さんと話す仕事は、慣れたら本心を伝えられない人になりそうで、早めにやめました。工事現場では、どんな仕事にもAIが使えるか試しています。"
  "2026-e":
    label: "2026-e"
    doing: "Second Brainの再開 → デーモン（自分の価値観を持たせようとしたAIの相棒）"
    thought: "自分をコピーしたクローンではなく、同じ価値から出発して、自分で考える存在をつくりたいと思いました。"
    thoughtNote: "プロンプトで価値観を入れてみても、判断は変わりませんでした。モデルがもう、その価値に同意していたからです。"
    next: "「デーモンがいないせいで、いまできていないことはあるか？」答えは「ない」でした。だから10月2日にたたみました。設定はそのまま残して、同じことはいつものClaudeのアプリでしています。"
  "2026-f":
    label: "2026-f"
    doing: "司令塔 — いくつものAIに仕事を分けて任せ、一か所から指示と確認をする作業環境"
    thought: "AIを使うときにいちばん大事なのは、性能よりハーネスだと思っています。"
    thoughtNote: "ハーネスとは、AIを使って、自分が望む成果を出せるようにするための枠組みです。"
    next: "このサイトも、いまここで直しています。"
