# Japanese translation of path.ko.yaml (2026-10-10), unified to です・ます (owner decision).
# Choices: docs/phase3-translation-notes.md
heading: "いまの考えは、どこから来たのか。"
nodes:
  "2023":
    label: "2023"
    doing: "個人プロジェクト、そしてバックエンドのインターン"
    thought: "AIがあれば、何でもできるようになると思っていました。"
    next: "本気でうまくなりたいことを、探しに出ました。"
  "2023-a":
    label: "2023-a"
    doing: "My Asset Manager（個人プロジェクト）"
    thought: "大学の教授の特別講義でつくった個人プロジェクトです。ChatGPTを使えば、知らない技術にどこまで慣れられるのか試したくて。"
    next: "その教授が、インターンを勧めてくださいました。"
  "2023-b":
    label: "2023-b"
    doing: "everyai — 教授に勧められたバックエンドのインターン"
    thought: "初めてAIをちゃんと使いました。AIで何でもできるようになる、と思いました。"
    next: "成果がすぐに見えないのが不安で、辞めました。振り返ると、焦りすぎていました。"
  "2024":
    label: "2024"
    doing: "パブ・工場・洋服のネットショップ"
    thought: "「面白そうだから」"
    thoughtNote: "仕事の中身より、どんな気持ちで働くかが大事だと気づきました。"
    photoAlts: ["工場で、出荷する荷物をトラックに積んだ日", "ネットショップの仕事で、床に積んだ袋詰めの服"]
    next: "ほとんどの作業はAIが代われます。だから、人と向き合う仕事がしたくなりました。"
  "2025":
    label: "2025"
    doing: "コスメの店（オリーブヤング）→ 日本でワーキングホリデー"
    thought: "楽しさから、一歩深く。"
    thoughtNote: "日本でもっと深く暮らしたい。人の役に立つことがしたい、と思うようになりました。"
    photoAlts: ["オリーブヤングで働いていたころ、制服姿で撮った鏡の自撮り", "ワーキングホリデー中、働いていたレストランで料理を運んでいるところ"]
    next: "仕事の流れを正確につかんで、AIで効率よくすることに惹かれました。自分でつくり始めました。"
  "2026-h1":
    label: "2026 前半"
    doing: "ワーキングホリデー中、3月にはじめたバイブコーディング"
    thought: "つくりながら、問いが変わっていきました。"
    next: "みんなの価値をどう見つけるのか。自分の価値さえ分からないのに。そのとき選んだ答えは、コードではなく人でした。"
  "2026-a":
    label: "2026-a"
    doing: "韓国式AI顔占い"
    thought: "はじめての一作です。完成して浮かんだのは「これ、なんでつくったんだろう」。答えは「はじめてだから、体験とテストを兼ねて」でした。"
    next: "次は、実際に使われるものをつくろうと決めました。"
  "2026-b":
    label: "2026-b"
    doing: "AI自販機"
    thought: "実際に使われるものを目指しました。でも、肝心の流れが思うように回りませんでした。"
    next: "AIの性能も自分の設計も足りず、だんだん手を離していきました。"
  "2026-c":
    label: "2026-c"
    doing: "imysh"
    thought: "これまでやってきたことを、せめてきちんと整理しておこうと思いました。"
    next: "kigaruとほぼ同じころ、同じ理由で止まりました。その次があるとしたら、いまです。"
  "2026-d":
    label: "2026-d"
    doing: "Second Brain（設計）"
    thought: "設計まではしました。でも、入れて取り出す手間が大きく見えて、そのままにしました。"
    next: "9月にその設計をもう一度取り出しました。いまは毎日使っています。"
  "2026-h2":
    label: "2026 後半"
    doing: "お客さんと話す営業の仕事 → 工事現場"
    thought: "この仕事に慣れたら、人に本心を伝えられない人になるかもしれない。"
    thoughtNote: "そう思って、早めに方向を変えました。"
