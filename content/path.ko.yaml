# Owner-reviewed Korean (2026-10-10, docs/phase3-drafts-ko.md). Sub-rows without a "next"
# line are open owner questions; they are omitted rather than guessed.
heading: "지금의 생각은, 어디서 왔는가."
nodes:
  "2023":
    label: "2023"
    doing: "개인 프로젝트, 그리고 백엔드 인턴"
    thought: "AI가 ‘어떻게’는 다 해 줄 것 같았다."
    thoughtNote: "그럼 중요한 건, 내가 ‘무엇을’ 잘하고 싶으냐다."
    next: "그 ‘무엇’을 찾으러, 이것저것 해 보기로 했다."
  "2023-a":
    label: "2023-a"
    doing: "My Asset Manager (개인 프로젝트)"
    thought: "대학 교수님의 특강에서 만든 개인 프로젝트. ChatGPT로 내가 모르던 기술에 얼마나 잘 적응할 수 있는지 시험해 보고 싶었다."
    next: "그 교수님이 인턴을 추천해 주셨다."
  "2023-b":
    label: "2023-b"
    doing: "everyai — 교수님이 추천해 주신 백엔드 인턴"
    thought: "AI를 처음 제대로 써 봤다. AI로 뭐든 가능해지겠다."
    next: "성과가 바로 안 보이는 게 불안해서 나왔다. 돌아보면 성급했다."
  "2024":
    label: "2024"
    doing: "펍 · 공장 · 온라인 옷 쇼핑몰"
    thought: "재밌어 보여서. 아니면, 같이 일하고 싶은 사람이 있어서."
    thoughtNote: "고르는 기준은 늘 ‘내가 즐거울까’였다."
    photoAlts: ["공장에서 출고 물량을 트럭에 싣던 날", "온라인 옷 쇼핑몰 일을 하며 바닥에 쌓아 둔 포장된 옷들"]
    next: "여러 곳에서 일해 보니, 일 자체보다 어떤 마음으로 하느냐가 중요했다. 좋아하는 걸 따라, 다음은 뷰티였다."
  "2025":
    label: "2025"
    doing: "화장품 매장(올리브영) → 일본 워킹홀리데이"
    thought: "대부분의 일의 흐름은 AI가 대신할 수 있겠다. 그럼 나는, 사람을 대하는 일을 하고 싶다."
    thoughtNote: "그래서 워홀에서도 서비스 일을 골랐다. 일본에 살면서, 여기서 더 깊게 살고 사람들에게 도움이 되는 걸 하고 싶어졌다."
    photoAlts: ["올리브영에서 일할 때 근무복을 입고 찍은 거울 셀카", "워킹홀리데이 중, 일하던 레스토랑에서 요리를 나르는 모습"]
    next: "도움이 되려면 뭘 할 수 있을까. 일의 흐름을 정확히 알고, AI로 가볍게 만드는 데 끌렸다. 직접 만들어 보기 시작했다."
  "2026-h1":
    label: "2026 전반"
    doing: "워킹홀리데이 중에, 3월에 처음 시작한 바이브 코딩"
    thought: "사람들이 스스로 원하는 가치를 찾도록, AI로 돕고 싶었다."
    thoughtNote: "만들수록 질문이 바뀌었다. 그 가치는 어떻게 찾지? 나조차 내 가치를 모르는데."
    next: "그때 택한 답은 코드가 아니라 사람이었다. 사람을 많이 만나고, 많이 이야기하러 나갔다."
  "2026-a":
    label: "2026-a"
    doing: "韓国式AI顔占い (한국식 AI 얼굴 점)"
    thought: "첫 프로젝트. 1차로 완성하고 나서 든 생각은 ‘이걸 왜 만들었지’. 답은 ‘처음이니까, 체험 겸 테스트로’."
    next: "다음엔 실제로 쓰일 걸 만들자."
  "2026-b":
    label: "2026-b"
    doing: "AI 자판기"
    thought: "실제로 쓰일 걸 목표로 했다. 그런데 핵심 흐름이 만족스럽게 돌아가지 않았다."
    next: "AI 성능도 내 설계도 부족해서, 점점 손을 놓았다."
  "2026-c":
    label: "2026-c"
    doing: "imysh"
    thought: "이때까지 한 거 정리라도 잘 해 놓자."
    next: "kigaru와 같은 때, 사람을 만나러 나가면서 멈췄다. 그다음이 있다면, 바로 지금이다."
  "2026-d":
    label: "2026-d"
    doing: "Second Brain (설계)"
    thought: "설계는 해 뒀다. 그런데 넣고 꺼내는 마찰이 커 보여서 그대로 뒀다."
    next: "9월에 그 설계를 다시 꺼냈다. 지금은 매일 쓰고, 그 위에서 데몬을 만들기 시작했다."
  "2026-h2":
    label: "2026 후반"
    doing: "손님과 이야기하는 영업 일 → 공사현장"
    thought: "사람을 대하는 일, 그리고 업종에 상관없이 AI를 써 보는 것."
    thoughtNote: "손님과 이야기하는 일은, 익숙해지면 진심을 전하지 못하는 사람이 될 것 같아 빨리 그만뒀다. 공사현장에서는 AI를 업종에 상관없이 적용해 보고 있다. 그 사이 9월, 미뤄 둔 Second Brain을 다시 꺼냈다."
  "2026-e":
    label: "2026-e"
    doing: "Second Brain 다시 꺼냄 → 데몬"
    thought: "나를 복사한 클론이 아니라, 같은 가치에서 출발해 스스로 생각하는 존재를 만들고 싶었다."
    thoughtNote: "가치는 넣을 게 아니라, 지킬 것이었다."
    next: "「데몬이 없어서 지금 안 되고 있는 일이 있나?」 답은 「없다」였다. 그래서 접었다. 공백이 아니라 방향 전환이다."
  "2026-f":
    label: "2026-f"
    doing: "지휘본부 — 내 프로젝트를 한 세션에서 굴리는 AI 작업 환경"
    thought: "AI를 쓸 때 제일 중요한 건, 성능보다 하네스라고 생각한다."
    thoughtNote: "하네스는 AI를 사용해, 내가 원하는 결과물을 낼 수 있도록 만드는 틀이다."
    next: "이 사이트도 지금 여기서 고치고 있다."
